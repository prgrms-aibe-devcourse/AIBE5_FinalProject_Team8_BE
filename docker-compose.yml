services:
  # DB (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: rootin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rootin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # BE (Spring Boot)
  be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootin-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rootin-network

  # FE (React 빌드 이미지)
  fe:
    image: ${DOCKERHUB_USERNAME}/rootin-fe:latest        # FE Dockerfile로 별도 빌드 후 사용
    container_name: rootin-fe
    restart: unless-stopped
    networks:
      - rootin-network

  # Nginx (리버스 프록시 + FE 서빙)
  nginx:
    image: nginx:alpine
    container_name: rootin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # FE 정적 파일은 fe 컨테이너에서 공유
      - fe_static:/usr/share/nginx/html:ro
    depends_on:
      be:
        condition: service_healthy
      fe:
        condition: service_healthy
    networks:
      - rootin-network

volumes:
  db_data:
  fe_static:

networks:
  rootin-network:
    driver: bridge
