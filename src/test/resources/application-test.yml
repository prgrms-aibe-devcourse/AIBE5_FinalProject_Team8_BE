# 테스트 환경 설정 (MySQL)
spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3307}/${TEST_DB_NAME:rootin_test}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

# 테스트 시 OpenAI 호출 차단 (더미 키 사용)
openai:
  api-key: test-dummy-key
  model: gpt-5.4-nano
  summary:
    max-tokens: 500
  quiz:
    max-tokens: 1000
