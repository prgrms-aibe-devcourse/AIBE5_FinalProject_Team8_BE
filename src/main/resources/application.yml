spring:
  application:
    name: Rootin

# OpenAI API 설정
openai:
  api-key: ${OPENAI_API_KEY:dummy}
  model: ${OPENAI_MODEL:gpt-5.4-nano}
  summary:
    max-tokens: ${OPENAI_SUMMARY_MAX_TOKENS:500}
  quiz:
    max-tokens: ${OPENAI_QUIZ_MAX_TOKENS:1000}

jwt:
  secret: "최소 32바이트 이상의 시크릿 키를 여기에 입력하세요"
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 1209600000  # 14일


# Actuator (Docker Health)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:rootin;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rootin}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

