name: Discord Issue Notification

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Issue Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DATE: ${{ github.event.issue.created_at }}

        run: |
          FORMATTED_DATE=$(date -d "$DATE" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || date '+%Y-%m-%d %H:%M:%S')

          # 액션별 이모지/제목
          if [ "$ACTION" = "opened" ]; then
            LABEL="🐛 [ISSUE OPEN]"
          elif [ "$ACTION" = "closed" ]; then
            LABEL="✅ [ISSUE CLOSED]"
          elif [ "$ACTION" = "reopened" ]; then
            LABEL="🔄 [ISSUE REOPENED]"
          fi
          
          # 이슈내용 (50자 제한)
          if [ -n "$ISSUE_BODY" ]; then
            BODY_TRIMMED=$(echo "$ISSUE_BODY" | head -c 50)
            ORIGINAL_LEN=$(echo -n "$ISSUE_BODY" | wc -c)
            if [ "$ORIGINAL_LEN" -gt 50 ]; then
              BODY_TRIMMED="${BODY_TRIMMED}..."
            fi
            TEXT+="💬 내용: $BODY_TRIMMED\n"
          fi
          
          # 이슈포럼 게시글 제목
          THREAD_NAME="$LABEL #$ISSUE_NUMBER $ISSUE_TITLE"
          
          # 포럼 본문 내용
          CONTENT="$LABEL **$REPO**\n"
          CONTENT+="👤 작성자: $ACTOR\n"
          CONTENT+="📅 날짜: $FORMATTED_DATE\n"
          CONTENT+="📝 제목: #$ISSUE_NUMBER $ISSUE_TITLE\n"
          CONTENT+="🗂 Repository: $REPO\n"
          if [ -n "$BODY_TRIMMED" ]; then
            CONTENT+="💬 내용: $BODY_TRIMMED\n"
          fi
          CONTENT+="🔗 $ISSUE_URL"

          # 포럼 채널용 JSON (thread_name 포함)
          jq -n \
            --arg thread "$THREAD_NAME" \
            --arg msg "$CONTENT" \
            '{thread_name: $thread, content: $msg}' | \
          curl -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"