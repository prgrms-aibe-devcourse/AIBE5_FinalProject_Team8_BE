name: Discord Push/PR Notification

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Push/PR Notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}

        run: |
          # 날짜 포맷 변환 (UTC → KST)
          FORMATTED_DATE=$(date -d "$DATE" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || date '+%Y-%m-%d %H:%M:%S')

          # COMMIT_MSG에서 제목/내용 분리
          COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -1)
          COMMIT_BODY=$(echo "$COMMIT_MSG" | tail -n +3)

          TEXT=""

          # Push 이벤트
          if [ "$EVENT_NAME" = "push" ]; then
            TEXT="📌 **[PUSH] $REPO**\n"
            TEXT+="🌿 브랜치: $BRANCH\n"
            TEXT+="👤 작성자: $ACTOR\n"
            TEXT+="📅 날짜: $FORMATTED_DATE\n"
            TEXT+="📝 **[ $COMMIT_TITLE\n ]**"
            if [ -n "$COMMIT_BODY" ]; then
              TEXT+="💬 Commit 내용: $COMMIT_BODY\n"
            fi
            TEXT+="🔗 $COMMIT_URL"

          # PR 이벤트
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "reopened" ]; then
              TEXT="🔔 **[PR OPEN] $REPO**\n"
              TEXT+="👤 작성자: $ACTOR\n"
              TEXT+="📅 날짜: $FORMATTED_DATE\n"
              TEXT+="🌿 브랜치: $PR_HEAD → $PR_BASE\n"
              TEXT+="📝 **[ $PR_TITLE\n ]**"
              if [ -n "$PR_BODY" ]; then
                TEXT+="💬 PR 내용: $PR_BODY\n"
              fi
              TEXT+="🔗 $PR_URL"

            elif [ "$PR_ACTION" = "closed" ]; then
              if [ "$PR_MERGED" = "true" ]; then
                TEXT="✅ **[PR MERGE DONE!] $REPO**\n"
                TEXT+="👤 작성자: $ACTOR\n"
                TEXT+="📅 날짜: $FORMATTED_DATE\n"
                TEXT+="🌿 브랜치: $PR_HEAD → $PR_BASE\n"
                TEXT+="📝 **[ $PR_TITLE\n ]**"
                TEXT+="🔗 $PR_URL"
              else
                TEXT="❌ **[PR CLOSED] $REPO**\n"
                TEXT+="👤 작성자: $ACTOR\n"
                TEXT+="📅 날짜: $FORMATTED_DATE\n"
                TEXT+="📝 **[ $PR_TITLE\n ]**"
                TEXT+="🔗 $PR_URL"
              fi
            fi
          fi

          if [ -n "$TEXT" ]; then
            jq -n --arg msg "$TEXT" '{content: $msg}' | \
            curl -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
          fi
