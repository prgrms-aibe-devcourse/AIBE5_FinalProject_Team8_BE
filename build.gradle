plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.rootin'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext['testcontainers.version'] = '1.20.4'

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	// 필수
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Security + JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// DB
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'

	// Lombok
	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// Swagger (springdoc)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// OpenAI Java Client
	implementation 'com.openai:openai-java:2.1.0'

	// AWS S3
	implementation 'software.amazon.awssdk:s3:2.26.12'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers (MySQL)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	// Metrics Collection (Prometheus)
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// HTML 파싱 (TIL 본문 경험치 산정 시 태그 제외 후 순수 텍스트 길이 계산)
	implementation 'org.jsoup:jsoup:1.18.1'
}

// ─── 테스트용 MySQL 컨테이너 생명주기 태스크 ─────────────────────────────────
// Testcontainers가 Windows Docker Desktop 환경에서 동작하지 않을 때 Docker CLI 경유로
// MySQL을 직접 기동·종료한다. CI(Linux)에서는 Testcontainers가 정상 동작하므로 무관.

task startTestDb(type: Exec) {
	description = '테스트용 MySQL 컨테이너를 기동한다'
	group = 'verification'
	// 이미 동일한 이름의 컨테이너가 있으면 제거 후 재기동
	commandLine 'docker', 'rm', '-f', 'rootin-test-mysql'
	ignoreExitValue = true
	doLast {
		exec {
			commandLine 'docker', 'run', '-d',
					'--name', 'rootin-test-mysql',
					'-e', 'MYSQL_ALLOW_EMPTY_PASSWORD=yes',
					'-e', 'MYSQL_DATABASE=rootin_test',
					'-p', '3307:3306',
					'mysql:8.0',
					'--character-set-server=utf8mb4',
					'--collation-server=utf8mb4_unicode_ci'
		}
		// MySQL 준비 대기 (최대 30초)
		int retries = 0
		while (retries < 15) {
			def result = exec {
				commandLine 'docker', 'exec', 'rootin-test-mysql',
						'mysqladmin', 'ping', '-u', 'root', '--silent'
				ignoreExitValue = true
			}
			if (result.exitValue == 0) break
			Thread.sleep(2000)
			retries++
		}
	}
}

task stopTestDb(type: Exec) {
	description = '테스트용 MySQL 컨테이너를 종료한다'
	group = 'verification'
	commandLine 'docker', 'stop', 'rootin-test-mysql'
	ignoreExitValue = true
	doLast {
		exec {
			commandLine 'docker', 'rm', '-f', 'rootin-test-mysql'
			ignoreExitValue = true
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// CI(Ubuntu) 기본 타임존이 UTC이므로 로컬(KST)과 동일한 환경으로 고정합니다.
	// LocalDate.now() 등 타임존 의존 코드가 환경에 따라 다르게 동작하는 flaky test를 방지합니다.
	jvmArgs '-Duser.timezone=Asia/Seoul'
	dependsOn startTestDb
	finalizedBy stopTestDb
}
